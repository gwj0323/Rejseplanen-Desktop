name: Rotate Keystore
on:
  workflow_dispatch:
    inputs:
      aes_key_hex:
        description: 'AES Key in Hex'
        required: true
      aes_iv_hex:
        description: 'AES IV in Hex'
        required: true

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate brand-new release keystore
        run: |
          # Generate high-entropy password
          KEY_PASS=$(openssl rand -hex 16)
          
          # Generate RSA 2048 keystore
          keytool -genkeypair -v \
            -keystore spor-release.jks \
            -alias spor -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Spor, OU=Spor Mobile, O=Spor, L=Copenhagen, C=DK"
          
          # Encode and package into JSON
          B64=$(base64 -w 0 spor-release.jks)
          jq -n --arg b64 "$B64" --arg pass "$KEY_PASS" \
            '{keystore_base64: $b64, password: $pass, alias: "spor"}' > payload.json
          
          # Encrypt with AES-256-CBC using provided ephemeral key and IV
          openssl enc -aes-256-cbc -K "${{ inputs.aes_key_hex }}" -iv "${{ inputs.aes_iv_hex }}" \
            -in payload.json -out encrypted.bin

      - name: Upload encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-keystore
          path: encrypted.bin
          retention-days: 1
