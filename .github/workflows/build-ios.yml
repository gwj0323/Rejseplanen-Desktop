name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Initialize iOS Platform
        working-directory: rejseplanen_mobile
        run: |
          rm -rf ios
          flutter create . --platforms=ios --org com.spor --project-name mobile
          python3 ../.github/scripts/patch_ios.py

      - name: Install dependencies
        working-directory: rejseplanen_mobile
        run: flutter pub get

      - name: Build iOS Application (Release, no-codesign)
        working-directory: rejseplanen_mobile
        run: |
          flutter build ios --release --no-codesign --verbose

      - name: Package into IPA
        working-directory: rejseplanen_mobile
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q spor-ios-release.ipa Payload
          ls -lh spor-ios-release.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spor-release-ipa
          path: rejseplanen_mobile/spor-ios-release.ipa
          retention-days: 3

  release:
    name: Publish iOS IPA Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: spor-release-ipa
          path: release_assets

      - name: Publish iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            release_assets/spor-ios-release.ipa

      - name: Prune older artifacts
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_COUNT: '1'
        run: python3 .github/scripts/cleanup_artifacts.py
