name: Cleanup Old Artifacts

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Number of latest artifacts to keep per artifact name'
        required: true
        default: '1'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    name: Cleanup Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prune old artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_COUNT: ${{ inputs.keep_count || '1' }}
        run: python3 .github/scripts/cleanup_artifacts.py
