name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least-privilege token: the build only needs to read the repo and upload artifacts.
permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Initialize Android Platform
        working-directory: rejseplanen_mobile
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.spor
          python3 ../.github/scripts/patch_android.py

      - name: Install dependencies
        working-directory: rejseplanen_mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: rejseplanen_mobile
        run: flutter build apk --release --verbose

      - name: Build Android App Bundle (Google Play AAB)
        working-directory: rejseplanen_mobile
        run: flutter build appbundle --release --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spor-release-apk
          path: rejseplanen_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: spor-release-aab
          path: rejseplanen_mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 3

      - name: Prune older artifacts
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_COUNT: '1'
        run: python3 .github/scripts/cleanup_artifacts.py
