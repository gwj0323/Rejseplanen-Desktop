name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Initialize Android Platform
        working-directory: rejseplanen_mobile
        run: |
          mkdir -p /tmp/res_backup
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res/* /tmp/res_backup/ 2>/dev/null || true
          fi

          if [ ! -f "android/gradlew" ]; then
            flutter create . --platforms=android --org com.rejseplanen
          fi

          if [ -d "/tmp/res_backup" ] && [ "$(ls -A /tmp/res_backup 2>/dev/null)" ]; then
            mkdir -p android/app/src/main/res
            cp -rn /tmp/res_backup/* android/app/src/main/res/ 2>/dev/null || true
          fi

          python3 ../.github/scripts/patch_android.py

      - name: Install dependencies

        working-directory: rejseplanen_mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: rejseplanen_mobile
        run: flutter build apk --release --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rejseplanen-release-apk
          path: rejseplanen_mobile/build/app/outputs/flutter-apk/app-release.apk
