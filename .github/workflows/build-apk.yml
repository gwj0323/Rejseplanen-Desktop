name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Initialize Android Platform
        working-directory: rejseplanen_mobile
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.rejseplanen
          python3 -c "
          import os, re

          # 1. Permissions
          p = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(p):
              with open(p, 'r') as f: c = f.read()
              perms = '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\n'
              c = c.replace('<application', perms + '    <application')
              with open(p, 'w') as f: f.write(c)

          # 2. Kotlin version
          for fn in ['android/build.gradle', 'android/settings.gradle']:
              if os.path.exists(fn):
                  with open(fn, 'r') as f: c = f.read()
                  c = re.sub(r\"ext\.kotlin_version\s*=\s*['\"][^'\"]+['\"]\", \"ext.kotlin_version = '1.9.22'\", c)
                  c = re.sub(r\"id\s*['\\\"]org\.jetbrains\.kotlin\.android['\\\"]\s*version\s*['\\\"][^'\\\"]+['\\\]\", \"id 'org.jetbrains.kotlin.android' version '1.9.22'\", c)
                  with open(fn, 'w') as f: f.write(c)

          # 3. compileSdkVersion 34
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f: c = f.read()
              c = re.sub(r'compileSdk(?:Version)?\s*=?\s*\d+', 'compileSdkVersion 34', c)
              c = re.sub(r'targetSdk(?:Version)?\s*=?\s*\d+', 'targetSdkVersion 34', c)
              with open(app_gradle, 'w') as f: f.write(c)
          "

      - name: Install dependencies
        working-directory: rejseplanen_mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: rejseplanen_mobile
        run: flutter build apk --release --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rejseplanen-release-apk
          path: rejseplanen_mobile/build/app/outputs/flutter-apk/app-release.apk
