name: rejseplanen_mobile
description: "A modern Flutter mobile client for Danish Public Transit (Rejseplanen)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.6
  geolocator: ^12.0.0
  dynamic_color: 1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
