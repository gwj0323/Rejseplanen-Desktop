name: mobile
description: "A modern Flutter mobile client for Danish Public Transit (Spor)."
publish_to: 'none'
version: 1.0.11+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.6
  geolocator: ^12.0.0
  dynamic_color: 1.7.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  add_2_calendar: ^3.0.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
